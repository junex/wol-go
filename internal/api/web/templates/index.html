<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOLGO - Wake On LAN Manager</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (CDN) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-lg">
            <a class="navbar-brand" href="/">
                <i class="fas fa-network-wired"></i> WOLGO
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm" id="btn-add">
                            <i class="fas fa-plus"></i> 添加设备
                        </button>
                    </li>
                </ul>

                <form class="d-flex my-2 my-lg-0" style="max-width: 300px;">
                    <div class="input-group">
                        <input class="form-control" type="search" id="search-input" placeholder="搜索设备...">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                    </div>
                </form>

                <select class="form-select form-select-sm ms-2" style="width: auto;" id="sort-select">
                    <option value="name">按名称排序</option>
                    <option value="ip">按 IP 排序</option>
                    <option value="mac">按 MAC 排序</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container-lg my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="fas fa-desktop"></i> 设备列表</h2>
            <span class="badge bg-primary" id="device-count">0 台设备</span>
        </div>

        <!-- 设备容器 -->
        <div id="computers-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-2">正在加载设备...</p>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">WOLGO v2.0 - Go版本 | <a href="https://github.com/Misterbabou/gptwol"
                    target="_blank">GitHub</a></span>
        </div>
    </footer>

    <!-- 添加/编辑设备模态框 -->
    <div class="modal fade" id="computerModal" tabindex="-1" aria-labelledby="computerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="computerModalLabel">添加设备</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="computer-form">
                        <input type="hidden" id="computer-mac-original">

                        <div class="mb-3">
                            <label for="computer-name" class="form-label">设备名称 <span
                                    class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="computer-name" required
                                placeholder="例如：我的电脑、NAS、服务器">
                        </div>

                        <div class="mb-3">
                            <label for="computer-mac" class="form-label">MAC 地址 <span
                                    class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="computer-mac" required
                                placeholder="XX:XX:XX:XX:XX:XX" pattern="^([0-9A-Fa-f]{2}:){5}([0-9A-Fa-f]{2})$">
                            <div class="form-text">格式：XX:XX:XX:XX:XX:XX（使用冒号分隔）</div>
                        </div>

                        <div class="mb-3">
                            <label for="computer-ip" class="form-label">IP 地址 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="computer-ip" required
                                placeholder="192.168.1.100">
                        </div>

                        <div class="mb-3">
                            <label for="computer-type" class="form-label">检测方式 <span
                                    class="text-danger">*</span></label>
                            <select class="form-select" id="computer-type" required>
                                <option value="icmp">ICMP (Ping)</option>
                                <option value="arp">ARP</option>
                                <option value="tcp">TCP (端口检测)</option>
                            </select>
                            <div class="form-text">选择用于检测设备在线状态的方式</div>
                        </div>

                        <div class="mb-3" id="tcp-port-group" style="display: none;">
                            <label for="computer-port" class="form-label">端口号</label>
                            <input type="number" class="form-control" id="computer-port" placeholder="8080" min="1"
                                max="65535">
                            <div class="form-text">TCP 检测时使用的端口号</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="btn-save-computer">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 自定义脚本 -->
    <script src="/static/js/config.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
